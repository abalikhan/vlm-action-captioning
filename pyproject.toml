[project]
name = "vlm-action-captioning"
version = "0.1.0"
description = "Fine-tuned Qwen2-VL-2B for video action captioning with MLOps"
requires-python = ">=3.11"

[project.optional-dependencies]
train = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "peft>=0.12.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.20.0",
    "wandb>=0.18.0",
    "pillow>=10.0.0",
    "decord>=0.6.0",
    "av>=12.0.0",
]
serve = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "vllm>=0.6.0",
    "modal>=0.64.0",
    "gradio>=4.40.0",
]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"