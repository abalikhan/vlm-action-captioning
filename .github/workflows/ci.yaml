name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest tests/ -v

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create empty model_weights dir for CI build
        run: mkdir -p model_weights

      - name: Build image (no model weights in CI)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.serve
          push: false
          tags: vlm-action-captioning:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max