name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest tests/ -v

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create empty model_weights dir for CI build
        run: mkdir -p model_weights

      - name: Build image (no model weights in CI)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.serve
          push: false
          tags: vlm-action-captioning:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-modal:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: pip install modal

      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy serving/modal/app.py

  deploy-spaces:
    runs-on: ubuntu-latest
    needs: deploy-modal
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Push to HF Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          git clone https://oauth2:$HF_TOKEN@huggingface.co/spaces/abidali1128/vlm-action-captioning hf_space
          cp serving/gradio/app.py hf_space/
          cp serving/gradio/requirements.txt hf_space/
          cp serving/gradio/README.md hf_space/
          cd hf_space
          git add .
          git diff --staged --quiet || git commit -m "deploy: update from GitHub ${{ github.sha }}"
          git push